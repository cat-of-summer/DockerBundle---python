# Generated by dockerbundle 0.2.0. Do not edit; change docker-bundle.yml and regenerate.
#
# Deploy:  docker compose --env-file .env up -d
# Update:  docker compose pull && docker compose up -d
#
# The bundle is one image holding every baked service. Anything that could not be baked
# is kept here as an ordinary neighbouring service.

services:
  shop:
    image: ${BUNDLE_IMAGE:-ghcr.io/acme/shop-bundle:test}
    container_name: shop${INSTANCE:-}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MYSQL_EXTERNAL_ACCESS}"
      - "127.0.0.1:9000:9000"
      - "${LARAVEL_NGINX_NGINX_EXTERNAL_ACCESS}"
      - "${VITE_ACCESS}"
      - "127.0.0.1:20000:20000"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD", "/usr/local/bin/bundle-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Not baked: kept outside the image by its recipe
  traefik:
    image: traefik:latest
    container_name: traefik${INSTANCE:-}
    restart: unless-stopped
    env_file: .env
    command:
      - "--entrypoints.web.address=:80"
      - "--api.insecure=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/letsencrypt
    networks:
      - network

volumes:
  mysql_data:

networks:
  network:
    external: true
    name: ${NETWORK:-network}
