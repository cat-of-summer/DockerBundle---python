name: ollama
priority: 60

match:
  image: ["ollama/ollama", "ollama/ollama:*"]

families: [debian]

port:
  default: 11434
  configure:
    type: env_var
    var: OLLAMA_HOST

supervisor:
  - name: "{slug}"
    command: ollama serve
    priority: 25
    stopsignal: TERM
    stopwaitsecs: 60
    scalable: false
    critical: true
    environment:
      OLLAMA_HOST: "0.0.0.0:{port}"
      OLLAMA_MODELS: /root/.ollama
      OLLAMA_ORIGINS: "*"

readiness:
  - type: http
    target: "http://127.0.0.1:{port}/api/tags"
    timeout: 120

mount_kinds:
  "/root/.ollama": state
  "/data": state
