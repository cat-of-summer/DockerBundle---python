name: python-gunicorn
priority: 60

match:
  image: ["python", "python:*", "*/python:*"]
  command: ["gunicorn", "uvicorn"]
  service: ["python", "gunicorn", "*-python"]

families: [debian]

install:
  debian: [python3, python3-venv, python3-pip, python3-dev, build-essential]

copy:
  - from_mount: /var/www/html
    dest: /var/www/{slug}
    kind: code
    optional: true
  - src: crontab
    dest: /etc/cron.d/{slug}
    kind: config
    optional: true
    chmod: "0644"

port:
  default: 8000
  configure:
    type: cli_flag
    flag: "--bind 0.0.0.0:"

supervisor:
  - name: "{slug}"
    # The package's own entrypoint builds /var/www/{slug}/venv at first start; prefer it
    # when present and fall back to the system interpreter otherwise.
    command: >-
      sh -c 'PATH=/var/www/{slug}/venv/bin:$PATH
      exec gunicorn --chdir /var/www/{slug} --bind 0.0.0.0:{port}
      --workers ${GUNICORN_WORKERS:-2} ${GUNICORN_APP:-wsgi:application}'
    directory: /var/www/{slug}
    priority: 35
    stopsignal: TERM
    stopwaitsecs: 30
    scalable: false
    critical: true

readiness:
  - type: tcp
    target: "{port}"
    timeout: 60

mount_kinds:
  "/var/www/*": code
  "/etc/crontab": config
  "/etc/supervisord.conf*": skip
