name: laravel
priority: 70

# Laravel is php-fpm plus a queue worker and a schedule. Everything php-fpm needs on
# Debian — the version-specific paths, the master config, one pool per service — comes
# from that recipe; this one only adds to it. Both share the `php-fpm` runtime, so the
# master and its build steps exist once whichever of them a bundle uses.
extends: php-fpm

# It must outrank the plain php-fpm recipe — but only for services that really are
# Laravel. A crontab is not evidence: every PHP package here ships one. The name is, so
# matching keys on that alone.
match:
  image: ["php:*fpm*", "php:*-fpm"]
  service: ["laravel", "laravel-*", "*-laravel"]
  package: ["*laravel*"]

+install:
  debian:
    - php-sqlite3

# The crontab is all it takes: the planner adds the cron daemon once it sees one baked.
+copy:
  - src: crontab
    dest: /etc/cron.d/{slug}
    kind: config
    optional: true
    chmod: "0644"

# The packages ship a plain user crontab pointing at /var/www/html. /etc/cron.d needs a
# user column, and the code now lives under the service's own directory, so both are
# fixed here. Using /etc/cron.d rather than /etc/crontab is what lets several PHP
# services each keep their own schedule.
+post_copy:
  - "sed -i -e 's#/var/www/html#/var/www/{slug}#g' -e 's#^\\([^#[:space:]][^[:space:]]*\\([[:space:]]\\+[^[:space:]]\\+\\)\\{4\\}\\)[[:space:]]\\+#\\1 root #' /etc/cron.d/{slug} || true"

# Queue workers are the one thing in the bundle that genuinely scales by process count:
# they pull from a queue rather than binding a port.
+supervisor:
  - name: queue-{slug}
    command: php /var/www/{slug}/artisan queue:work --sleep=3 --tries=3 --max-time=3600
    directory: /var/www/{slug}
    priority: 60
    stopsignal: TERM
    stopwaitsecs: 120
    scalable: true
    critical: false

mount_kinds:
  "/var/www/*": code
  # These are the upstream php image's paths and the package's own process manager.
  # The bundle supplies its own equivalents, so copying them in would either land
  # somewhere the distro php never reads or collide with another service.
  "/usr/local/etc/php/*": skip
  "/etc/crontab": skip
  "/etc/supervisord.conf": skip
